<svg width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Your linear gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#38ef7d" />
    </linearGradient>

    <!-- Dots -->
    <pattern id="dots" x="0" y="0" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.5" fill="white" opacity="0.08" />
    </pattern>

    <!-- Glow with blended color -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#38ef7d" stop-opacity="0.15" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>
  </defs>

  <!-- Background gradient -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />

  <!-- Light dotted overlay -->
  <rect width="100%" height="100%" fill="url(#dots)" />

  <!-- Soft focus center glow -->
  <circle cx="50" cy="50" r="50" fill="url(#glow)" />
</svg>
